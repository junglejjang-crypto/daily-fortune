<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 운세</title>
<meta property="og:title" content="오늘의 운세">
<meta property="og:description" content="띠별 오늘의 운세, 운세지수, 추천 점심메뉴, 행운의 아이템까지 매일 06:00 자동 업데이트">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="오늘의 운세">
<meta name="twitter:description" content="띠별 오늘의 운세, 운세지수, 추천 점심메뉴, 행운의 아이템까지 매일 06:00 자동 업데이트">
<style>
  :root{
    --bg:#f7f8fb;
    --card-bg:#ffffff;
    --text:#1f2430;
    --sub:#6b7280;
    --accent:#ff7a59;
    --accent2:#5b8def;
    --border:#e8eaf0;
    --shadow:0 4px 16px rgba(20,20,40,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px 16px 64px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header{text-align:center;margin-bottom:24px;}
  header h1{font-size:28px;margin:0 0 8px;letter-spacing:-0.5px;}
  header .date{color:var(--sub);font-size:15px;}
  header .next-update{color:var(--sub);font-size:12px;margin-top:6px;}

  /* 👑 오늘의 최고 행운 띠 배너 */
  .rank-banner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    max-width:560px;
    margin:0 auto 20px;
    padding:13px 18px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#fff3ec,#eef3ff);
    box-shadow:0 3px 12px rgba(255,122,89,0.15);
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    color:#3a3f4b;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .rank-banner:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(255,122,89,0.25);}
  .rank-banner .crown{font-size:20px;}
  .rank-banner .rank-emoji{font-size:22px;}
  .rank-banner .rank-score{color:var(--accent);}

  /* 내 띠 바로가기 칩 */
  .chip-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:6px 4px 14px;
    margin:0 auto 6px;
    max-width:1080px;
    scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  .chip-scroll::-webkit-scrollbar{height:6px;}
  .chip-scroll::-webkit-scrollbar-thumb{background:#dfe2ea;border-radius:3px;}
  .chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:5px;
    padding:7px 13px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--card-bg);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip .chip-emoji{font-size:16px;}
  .chip .chip-score{font-size:11px;font-weight:700;color:var(--accent2);}
  .chip:hover{border-color:var(--accent2);background:#f5f8ff;transform:translateY(-1px);}
  .chip.my-chip{
    background:linear-gradient(90deg,#fff3ec,#fff8e8);
    border-color:var(--accent);
    color:#c2552f;
  }
  .chip .chip-star{font-size:12px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform .15s ease;
    scroll-margin-top:16px;
  }
  .card:hover{transform:translateY(-3px);}
  .card.highlight{
    animation:cardGlow 1.6s ease;
  }
  @keyframes cardGlow{
    0%{box-shadow:0 0 0 0 rgba(255,122,89,0.0);transform:scale(1);}
    25%{box-shadow:0 0 0 5px rgba(255,122,89,0.35);transform:scale(1.02);border-color:var(--accent);}
    60%{box-shadow:0 0 0 3px rgba(255,122,89,0.2);transform:scale(1.01);}
    100%{box-shadow:var(--shadow);transform:scale(1);border-color:var(--border);}
  }
  .card.my-card{
    border:1.5px solid var(--accent);
    background:linear-gradient(180deg,#fffaf6 0%,#ffffff 60%);
  }
  .card-top{display:flex;align-items:center;gap:12px;}
  .emoji{
    font-size:42px;
    width:60px;height:60px;
    display:flex;align-items:center;justify-content:center;
    background:#fdf1ec;
    border-radius:14px;
    flex-shrink:0;
  }
  .name-box .name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .name-box .my-badge{
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    border-radius:999px;
    padding:2px 8px;
  }
  .name-box .years{font-size:12px;color:var(--sub);}
  .fortune-section{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .fortune-section .label{
    font-size:11.5px;
    font-weight:700;
    color:var(--accent2);
  }
  .fortune-section .text{
    font-size:13px;
    line-height:1.55;
    color:#3a3f4b;
  }
  .lunch-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#f5f8ff;
    border-radius:10px;
    padding:8px 10px;
    margin-top:2px;
  }
  .lunch-box .lunch-emoji{font-size:20px;}
  .lunch-box .lunch-text{font-size:13px;font-weight:600;color:#33415c;}
  .lunch-box .lunch-label{font-size:11px;color:var(--sub);display:block;font-weight:400;}

  /* 오늘의 행운 요소 */
  .lucky-box{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:linear-gradient(135deg,#fdf6ff,#f0f7ff);
    border:1px dashed #d9d3f0;
    border-radius:10px;
    padding:10px 12px;
  }
  .lucky-box .lucky-title{
    font-size:11px;
    font-weight:700;
    color:#8b6fd8;
    margin-bottom:2px;
  }
  .lucky-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#3a3f4b;}
  .lucky-row .lucky-emoji{font-size:15px;flex-shrink:0;}
  .lucky-row .lucky-key{color:var(--sub);font-size:11.5px;flex-shrink:0;}
  .lucky-row .lucky-val{font-weight:700;color:#4a4e8f;}
  .lucky-swatch{
    display:inline-block;
    width:12px;height:12px;
    border-radius:50%;
    margin-right:4px;
    vertical-align:-1px;
    border:1px solid rgba(0,0,0,0.08);
  }

  .score-row{display:flex;align-items:center;gap:8px;}
  .score-label{font-size:12px;color:var(--sub);white-space:nowrap;}
  .score-bar{
    flex:1;
    height:8px;
    background:#eef0f5;
    border-radius:6px;
    overflow:hidden;
  }
  .score-fill{
    height:100%;
    border-radius:6px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
  }
  .score-num{font-size:13px;font-weight:700;color:var(--accent);min-width:34px;text-align:right;}

  /* 공유 버튼 */
  .share-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    margin-top:2px;
    padding:10px 12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#5b8def,#7aa5f5);
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:opacity .15s ease, transform .15s ease;
  }
  .share-btn:hover{opacity:0.9;transform:translateY(-1px);}
  .share-btn:active{transform:translateY(0);}

  /* ⭐ 내 띠 저장 버튼 */
  .save-btn{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:2px;
    padding:7px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:#fff;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    color:var(--sub);
    cursor:pointer;
    transition:all .15s ease;
  }
  .save-btn:hover{border-color:var(--accent);color:var(--accent);}
  .save-btn.saved{
    background:linear-gradient(90deg,#fff3ec,#fff8e8);
    border-color:var(--accent);
    color:#c2552f;
    font-weight:700;
  }

  /* 토스트 */
  .toast{
    position:fixed;
    left:50%;
    bottom:36px;
    transform:translateX(-50%) translateY(20px);
    background:rgba(31,36,48,0.92);
    color:#fff;
    font-size:13.5px;
    font-weight:600;
    padding:12px 20px;
    border-radius:999px;
    box-shadow:0 6px 24px rgba(20,20,40,0.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:100;
    max-width:88vw;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{
    text-align:center;
    margin-top:40px;
    font-size:11px;
    color:#a0a4ae;
  }
  @media (max-width:480px){
    body{padding:24px 12px 56px;}
    header h1{font-size:23px;}
    .grid{grid-template-columns:1fr;}
    .rank-banner{font-size:13.5px;padding:11px 14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔮 오늘의 띠별 운세</h1>
    <div class="date" id="todayDate">-</div>
    <div class="next-update" id="nextUpdate">매일 오전 06:00 자동 업데이트</div>
  </header>
  <button class="rank-banner" id="rankBanner" style="display:none" aria-label="1위 띠 카드로 이동">
    <span class="crown">👑</span>
    <span id="rankBannerText">오늘의 최고 행운 띠</span>
  </button>
  <div class="chip-scroll" id="chipScroll" aria-label="띠 바로가기"></div>
  <div class="grid" id="grid"></div>
  <footer>본 콘텐츠는 자동 생성된 운세이며, 매일 06:00에 새 운세로 갱신됩니다.</footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const ZODIACS = [

// 총운

// 애정운
const LOVE_POOL = [
  "애정운: 솔로라면 우연한 만남에서 호감이 싹틀 수 있는 날이에요. 커플이라면 사소한 배려가 관계를 더 단단하게 만들어줍니다.",

  "애정운: 혼자만의 시간을 충분히 가져도 좋은 날입니다. 스스로를 아끼는 마음이 결국 관계에도 좋은 영향을 줍니다."

// 재물운
const MONEY_POOL = [
  "재물운: 작은 행운이 따르는 흐름이지만 즉흥적인 소비는 피하고 계획적으로 움직이는 것이 좋아요.",

  "재물운: 투자나 재테크 관련 정보가 들어올 수 있는 날입니다. 다만 성급한 결정보다는 충분히 검토한 뒤 움직이세요.",

// 직장/학업운
const WORK_POOL = [
  "직장·학업운: 막혔던 업무나 과제가 풀리는 신호가 보여요. 미뤄둔 일을 다시 들여다보면 의외로 쉽게 진행됩니다.",

// 날짜+띠 문자열을 시드로 만드는 간단한 해시 (mulberry32 기반)
function strToSeed(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function getTodayKey(){
  const now = new Date();
  // 06:00 이전이면 '운세상 어제'로 취급해 06시 기준으로 갱신되도록 함
  const ref = new Date(now);
  if (now.getHours() < 6) ref.setDate(ref.getDate() - 1);
  const y = ref.getFullYear(), m = String(ref.getMonth()+1).padStart(2,"0"), d = String(ref.getDate()).padStart(2,"0");
  return {key:`${y}-${m}-${d}`, displayDate: ref};
}

function getMyZodiac(){
  try{
    return localStorage.getItem(MY_ZODIAC_KEY) || null;
  }catch(e){ return null; }
}
function setMyZodiac(key){
  try{
    if(key) localStorage.setItem(MY_ZODIAC_KEY, key);
    else localStorage.removeItem(MY_ZODIAC_KEY);
  }catch(e){}
}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}

// 카드/칩으로 부드럽게 이동 + 하이라이트 애니메이션
function focusCard(zodiacKey){
  const card = document.querySelector(`.card[data-zodiac="${zodiacKey}"]`);
  if(!card) return;
  card.scrollIntoView({behavior:"smooth", block:"center"});
  card.classList.remove("highlight");
  // 애니메이션 재시작을 위한 리플로우
  void card.offsetWidth;
  card.classList.add("highlight");
}

function shareFortune(data){
  const text =
    `🔮 ${data.dateLabel} ${data.name} 운세\n` +
    `━━━━━━━━━━━━━━\n` +
    `${data.general}\n\n` +
    `${data.love}\n\n` +
    `${data.money}\n\n` +
    `${data.work}\n\n` +
    `🍽️ 추천 점심: ${data.lunch}\n` +
    `🍀 행운의 색상: ${data.color} / 숫자: ${data.number} / 시간대: ${data.time}\n` +
    `📊 오늘의 운세지수: ${data.score}점\n` +
    `━━━━━━━━━━━━━━\n` +
    `${SITE_URL}`;
  if(navigator.share){
    navigator.share({title:"오늘의 운세", text:text, url:SITE_URL})
      .catch(err => {
        // 사용자가 공유를 취소한 경우(AbortError)는 조용히 넘어감
        if(err && err.name !== "AbortError"){
          copyToClipboard(text, "클립보드에 복사되었습니다!");
        }
      });
  }else{
    copyToClipboard(text, "클립보드에 복사되었습니다!");
  }
}

function copyToClipboard(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(() => showToast(msg))
      .catch(() => fallbackCopy(text, msg));
  }else{
    fallbackCopy(text, msg);
  }
}
function fallbackCopy(text, msg){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand("copy");
    showToast(msg);
  }catch(e){
    showToast("복사에 실패했습니다. 직접 선택해주세요.");
  }
  document.body.removeChild(ta);
}

    const number = 1 + Math.floor(rng() * 99); // 1~99
    const time = LUCKY_TIMES[Math.floor(rng() * LUCKY_TIMES.length)];
    const score = 55 + Math.floor(rng() * 46); // 55~100

    const idx = ordered.findIndex(r => r.z.key === myZodiac);
    if(idx > 0) ordered.unshift(ordered.splice(idx, 1)[0]);

  // 3) 👑 1위 랭킹 배너

  const grid = document.getElementById("grid");

  ordered.forEach(r => {
    const isMine = r.z.key === myZodiac;
    const card = document.createElement("div");
    card.className = "card" + (isMine ? " my-card" : "");
    card.dataset.zodiac = r.z.key;
    card.innerHTML = `
      <div class="card-top">
        <div class="emoji">${r.z.emoji}</div>
        <div class="name-box">
          <div class="name">${r.z.key}띠${isMine ? '<span class="my-badge">⭐ 내 띠</span>' : ""}</div>
          <div class="years">${r.z.years}</div>
        </div>
      </div>
      <div class="fortune-section">
        <span class="label">총운</span>
        <span class="text">${r.general}</span>
      </div>
      <div class="fortune-section">
        <span class="text">${r.love}</span>
      </div>
      <div class="fortune-section">
        <span class="text">${r.money}</span>
      </div>
      <div class="fortune-section">
        <span class="text">${r.work}</span>
      </div>
      <div class="lunch-box">
        <span class="lunch-emoji">${r.lunch.emoji}</span>
        <span class="lunch-text"><span class="lunch-label">오늘의 추천 점심메뉴</span>${r.lunch.name}</span>
      </div>
      <div class="lucky-box">
        <span class="lucky-title">🍀 오늘의 행운 요소</span>
        <div class="lucky-row"><span class="lucky-emoji">🎨</span><span class="lucky-key">행운의 색상</span><span class="lucky-val"><span class="lucky-swatch" style="background:${r.color.hex}"></span>${r.color.name}</span></div>
        <div class="lucky-row"><span class="lucky-emoji">🔢</span><span class="lucky-key">행운의 숫자</span><span class="lucky-val">${r.number}</span></div>
        <div class="lucky-row"><span class="lucky-emoji">⏰</span><span class="lucky-key">행운의 시간대</span><span class="lucky-val">${r.time}</span></div>
      </div>
      <div class="score-row">
        <span class="score-label">운세지수</span>
        <div class="score-bar"><div class="score-fill" style="width:${r.score}%"></div></div>
        <span class="score-num">${r.score}</span>
      </div>
      <button class="share-btn" aria-label="${r.z.key}띠 운세 공유하기">📤 운세 공유하기</button>

// 다음 06:00까지 남은 시간을 계산해 자동 새로고침 예약
function scheduleNextUpdate(){
  const now = new Date();
  const next = new Date(now);
  next.setHours(6,0,0,0);
  if (now >= next) next.setDate(next.getDate() + 1);

  const msUntilNext = next - now;
  document.getElementById("nextUpdate").textContent =
    `다음 갱신: ${next.toLocaleDateString("ko-KR",{month:"long",day:"numeric"})} 06:00 (매일 자동)`;

  setTimeout(() => {
    renderFortunes();
    scheduleNextUpdate();
  }, msUntilNext);
}
